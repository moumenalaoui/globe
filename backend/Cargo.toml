[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
csv = "1"
dotenvy = "0.15"

[dev-dependencies]
insta = { version = "1.39", features = ["json"] }
